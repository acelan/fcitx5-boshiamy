name: Build and Release

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      - name: Install base tools and CA certificates
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates \
            git

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            debhelper \
            dpkg-dev \
            extra-cmake-modules \
            fcitx5-modules-dev \
            gettext \
            libfcitx5config-dev \
            libfcitx5core-dev \
            libfcitx5utils-dev \
            pkgconf

      - name: Build Debian package and run tests
        run: |
          dpkg-buildpackage -us -uc -b
          mkdir -p dist
          cp -v ../fcitx5-boshiamy_*.deb dist/

      - name: Upload Debian package artifact
        uses: actions/upload-artifact@v4
        with:
          name: fcitx5-boshiamy-deb
          path: dist/*.deb

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb
          generate_release_notes: true
